name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Rebuild and republish the latest main firmware without cutting a release.
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Tests and compilation are unprivileged by default. Only the main-only publish job can access
# the signing environment and write releases/Pages.
permissions:
  contents: read

jobs:
  logic-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run host-side logic tests
        run: ./scripts/run-mock-tests.sh
      - name: Test ESP-IDF build contracts
        run: |
          ./scripts/ci-build-all.sh --self-test
          python3 scripts/check-sdkconfig-defaults.py --self-test
          python3 scripts/report-firmware-size.py --self-test
          ./.claude/hooks/build-efficiency-check.sh --self-test
          test "$(./scripts/idf-version.sh)" = v5.5.5

      # The PR-gate command matcher (.claude/hooks/pr-gate-lib.sh). Cheap, offline, and it
      # guards a hole that is invisible in review: an unmatched command is not a lenient
      # verdict, it is NO verdict — the hook exits 0 having checked nothing, so a regression
      # here silently disarms the merge gate rather than failing loudly.
      - name: Test the PR-gate command matcher
        run: ./scripts/test-pr-gates.sh

  build:
    needs: logic-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      display-version: ${{ steps.stamp.outputs.disp }}
      release-version: ${{ steps.version.outputs.version }}
      firmware: ${{ steps.changes.outputs.firmware }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read pinned ESP-IDF toolchain
        id: toolchain
        run: |
          echo "version=$(./scripts/idf-version.sh)" >> "$GITHUB_OUTPUT"
          echo "image-version=$(./scripts/idf-version.sh --image-version)" >> "$GITHUB_OUTPUT"
          h="$(sha256sum esp-idf-toolchain.txt sdkconfig.defaults sdkconfig.defaults.* \
               dependencies.lock.* | sha256sum | cut -c1-16)"
          echo "cache-hash=$h" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = pull_request ]; then scope=pr; else scope=main; fi
          echo "cache-scope=$scope" >> "$GITHUB_OUTPUT"
          echo "ESP-IDF image: $(./scripts/idf-version.sh --image)"

      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          # Never let a PR-populated compiler-object cache feed a main build that will be signed.
          key: ccache-${{ steps.toolchain.outputs.cache-hash }}-${{ steps.toolchain.outputs.cache-scope }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ steps.toolchain.outputs.cache-hash }}-${{ steps.toolchain.outputs.cache-scope }}-

      - name: Compute release version
        id: version
        run: |
          git fetch --tags --force
          next="$(./scripts/next-version.sh)"
          latest="$(git tag -l 'v*' --sort=-v:refname | head -n1 | sed 's/^v//')"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Detect firmware-relevant changes
        id: changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            changed=yes
          elif git diff --name-only "$before" "${{ github.sha }}" | grep -qE \
            '^(main/|patches/tesla-ble/|CMakeLists\.txt$|sdkconfig\.defaults(\.[a-z0-9]+)?$|dependencies\.lock\.[a-z0-9]+$|esp-idf-toolchain\.txt$|partitions\.csv$|version\.txt$|\.github/workflows/(build|signed-pr-preview|pr-preview-cleanup)\.yml$|scripts/(ci-build-all|ci-build-verify|ci-sign-artifacts|test-release-contract|check-reproducible-build|idf-docker|idf-version|build-pages|apply-tesla-ble-patches)\.sh$|scripts/(check-pages-manifest|check-sdkconfig-defaults|report-firmware-size)\.py$)'; then
            changed=yes
          else
            changed=no
          fi
          echo "firmware=$changed" >> "$GITHUB_OUTPUT"

      - name: Stamp firmware version
        id: stamp
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="${{ steps.version.outputs.latest }}"
            [ -n "$base" ] || base="${{ steps.version.outputs.version }}"
            disp="${base}-PR-${{ github.event.pull_request.number }}"
          elif [ "${{ steps.changes.outputs.firmware }}" = yes ]; then
            disp="${{ steps.version.outputs.version }}"
          else
            disp="${{ steps.version.outputs.latest }}"
            [ -n "$disp" ] || disp="${{ steps.version.outputs.version }}"
          fi
          echo "$disp" > version.txt
          echo "disp=$disp" >> "$GITHUB_OUTPUT"
          echo "stamped firmware version: $disp"

      # Full SHA pins both the action implementation and the digest-pinned ESP-IDF image it starts.
      # This job has neither the OTA key nor a write-capable GITHUB_TOKEN.
      - name: Build all targets and exercise reproducibility plus disposable-key release contracts
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: ${{ steps.toolchain.outputs.image-version }}
          target: esp32
          command: >-
            ./scripts/ci-build-verify.sh
            "${{ steps.stamp.outputs.disp }}"
            "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Publish firmware size summary
        if: always()
        run: |
          for report in dist/*/size-*.md; do
            [ -f "$report" ] && cat "$report" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload unsigned build and diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: firmware-unsigned
          if-no-files-found: error
          retention-days: 7
          path: |
            _unsigned/
            dist/

  publish:
    needs: build
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: firmware-signing
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: read
    steps:
      # Checkout only the exact main commit that produced the unsigned data artifact.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download unsigned build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: firmware-unsigned
          path: .

      - name: Validate build provenance
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_VERSION: ${{ needs.build.outputs.display-version }}
        run: |
          set -euo pipefail
          meta=dist/build-metadata.txt
          test -f "$meta" && test ! -L "$meta"
          test "$(sed -n '/^head_sha=/p' "$meta" | wc -l | tr -d ' ')" -eq 1
          test "$(sed -n '/^display_version=/p' "$meta" | wc -l | tr -d ' ')" -eq 1
          actual_sha="$(sed -n 's/^head_sha=//p' "$meta")"
          actual_version="$(sed -n 's/^display_version=//p' "$meta")"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "provenance SHA mismatch: expected=$EXPECTED_SHA actual=$actual_sha" >&2
            exit 1
          fi
          if [ "$actual_version" != "$EXPECTED_VERSION" ]; then
            echo "provenance version mismatch: expected=$EXPECTED_VERSION actual=$actual_version" >&2
            exit 1
          fi
          if find _unsigned -type l -print -quit | grep -q .; then
            echo "refusing symlinks in unsigned artifact" >&2
            exit 1
          fi

      - name: Provision OTA signing key
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          if [ -z "$OTA_SIGNING_KEY" ]; then
            echo "OTA_SIGNING_KEY is required in the firmware-signing environment" >&2
            exit 1
          fi
          printf '%s\n' "$OTA_SIGNING_KEY" > ota_signing_key.pem
          chmod 600 ota_signing_key.pem

      # Only trusted main scripts and the digest-pinned ESP-IDF image see the key. No PR source is
      # compiled or executed in this job; the input artifact is handled strictly as binary data.
      - name: Sign and stage release artifacts
        env:
          DISPLAY_VERSION: ${{ needs.build.outputs.display-version }}
        run: ./scripts/idf-docker.sh ./scripts/ci-sign-artifacts.sh "$DISPLAY_VERSION" _unsigned

      - name: Remove OTA signing key
        if: always()
        run: rm -f ota_signing_key.pem

      - name: Upload signed firmware artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tesla-key-esp32-${{ needs.build.outputs.display-version }}
          if-no-files-found: error
          path: |
            tesla-key-esp32*.bin
            dist/

      - name: Create release
        if: github.event_name == 'push' && needs.build.outputs.firmware == 'yes'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: v${{ needs.build.outputs.release-version }}
          name: v${{ needs.build.outputs.release-version }}
          generate_release_notes: true
          files: |
            tesla-key-esp32*.bin
            dist/*/*.elf
            dist/*/*.elf.sha256
            dist/*/*.map
            dist/*/sdkconfig.*
            dist/*/dependencies.lock.*
            dist/*/size-*.json
            dist/*/size-*.md

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Assemble Pages site
        env:
          DISPLAY_VERSION: ${{ needs.build.outputs.display-version }}
          SOURCE_SHA: ${{ github.sha }}
        run: ./scripts/build-pages.sh ./_site "$DISPLAY_VERSION" "$SOURCE_SHA"

      - name: Publish site to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/publish-pages-branch.sh root ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./_site

  deploy:
    needs: publish
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
      - name: Wait before retrying the Pages deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Retry deploy to GitHub Pages
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
