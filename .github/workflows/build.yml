name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Unprivileged rebuild/test of latest main only. Manual runs never sign, release or republish
  # the Release-bound Pages channel.
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Tests and compilation are unprivileged by default. Only the main-only publish job can access the
# signing Environment and write the immutable Release; only the separate key-free deploy job writes
# branch-backed Pages from publish's exact SHA/version-bound artifact.
permissions:
  contents: read

jobs:
  logic-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # repo-lint checks the checked-out commit itself; PR merge refs need both parents present.
          fetch-depth: 0
      - name: Validate project agent configuration
        run: ./tools/agent-config/selftest.sh
      - name: Validate repository syntax, links and workflow policy
        run: ./scripts/repo-lint.sh
      - name: Run host-side logic tests
        run: ./scripts/run-mock-tests.sh --require-all
      - name: Prove and run Linux memory-safety instrumentation
        run: |
          ./scripts/run-sanitizer-tests.sh --self-test
          ./scripts/run-sanitizer-tests.sh
      - name: Test ESP-IDF build contracts
        run: |
          ./scripts/ci-build-all.sh --self-test
          ./scripts/select-release-version.sh --self-test
          python3 scripts/check-sdkconfig-defaults.py --self-test
          python3 scripts/report-firmware-size.py --self-test
          python3 scripts/check-build-gate-contract.py --self-test
          python3 tools/agent-hooks/agent_hook.py build-efficiency --self-test
          test "$(./scripts/idf-version.sh)" = v5.5.5

      # The PR-gate command matcher (tools/agent-hooks/pr-gate-lib.sh). Cheap, offline, and it
      # guards a hole that is invisible in review: an unmatched command is not a lenient
      # verdict, it is NO verdict — the hook exits 0 having checked nothing, so a regression
      # here silently disarms the merge gate rather than failing loudly.
      - name: Test the PR-gate command matcher
        run: ./scripts/test-pr-gates.sh

  build:
    needs: logic-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # release-relevance.sh reads the configured live Pages URL; without this minimum scope the
      # Pages API fails and every docs-only main push conservatively schedules a new Release.
      pages: read
    outputs:
      display-version: ${{ steps.stamp.outputs.disp }}
      release-version: ${{ steps.version.outputs.version }}
      firmware: ${{ steps.changes.outputs.firmware }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR artifacts and their provenance are built from the exact current head. The separate
          # logic-test job intentionally keeps GitHub's merge ref to catch base-integration issues.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Read pinned ESP-IDF toolchain
        id: toolchain
        run: |
          echo "version=$(./scripts/idf-version.sh)" >> "$GITHUB_OUTPUT"
          echo "image-version=$(./scripts/idf-version.sh --image-version)" >> "$GITHUB_OUTPUT"
          echo "ESP-IDF image: $(./scripts/idf-version.sh --image)"

      - name: Compute release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git fetch --tags --force
          if [ "$EVENT_NAME" = push ] && [ "${{ github.ref }}" = refs/heads/main ]; then
            release="$(./scripts/select-release-version.sh --select-main "$SOURCE_SHA")"
          else
            release="$(./scripts/select-release-version.sh)"
          fi
          latest="$(./scripts/select-release-version.sh --latest-published-stable)"
          echo "version=$release" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Detect firmware-relevant changes
        id: changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if ! changed="$(./scripts/release-relevance.sh --changed "$SOURCE_SHA")"; then
            echo "release relevance check failed; scheduling publication reconciliation" >&2
            changed=yes
          fi
          case "$changed" in
            yes|no) ;;
            *) echo "invalid release relevance result: $changed" >&2; exit 1 ;;
          esac
          echo "firmware=$changed" >> "$GITHUB_OUTPUT"

      - name: Stamp firmware version
        id: stamp
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="${{ steps.version.outputs.latest }}"
            [ -n "$base" ] || base="${{ steps.version.outputs.version }}"
            disp="${base}-PR-${{ github.event.pull_request.number }}"
          elif [ "${{ steps.changes.outputs.firmware }}" = yes ]; then
            disp="${{ steps.version.outputs.version }}"
          else
            disp="${{ steps.version.outputs.latest }}"
            [ -n "$disp" ] || disp="${{ steps.version.outputs.version }}"
          fi
          echo "$disp" > version.txt
          echo "disp=$disp" >> "$GITHUB_OUTPUT"
          echo "stamped firmware version: $disp"

      # Full SHA pins both the action implementation and the digest-pinned ESP-IDF image it starts.
      # This job has neither the OTA key nor a write-capable GITHUB_TOKEN.
      - name: Build all targets and exercise reproducibility plus disposable-key release contracts
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: ${{ steps.toolchain.outputs.image-version }}
          target: esp32
          command: >-
            ./scripts/ci-build-verify.sh
            "${{ steps.stamp.outputs.disp }}"
            "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Publish firmware size summary
        if: always()
        run: |
          for report in dist/*/size-*.md; do
            [ -f "$report" ] && cat "$report" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload unsigned build and diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: firmware-unsigned
          if-no-files-found: error
          retention-days: 7
          path: |
            _unsigned/
            dist/

  independent-rebuild:
    # On main, a distinct runner rebuilds the exact source without secrets, write permissions,
    # signing environment or a cache restored from the producer. PR preview trust does not use
    # this PR-controlled workflow definition; signed-pr-preview.yml owns its workflow_run rebuild.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read pinned ESP-IDF toolchain
        id: toolchain
        run: |
          echo "image-version=$(./scripts/idf-version.sh --image-version)" >> "$GITHUB_OUTPUT"
          echo "ESP-IDF image: $(./scripts/idf-version.sh --image)"
      - name: Apply the producer's exact display-version stamp
        env:
          DISPLAY_VERSION: ${{ needs.build.outputs.display-version }}
        run: printf '%s\n' "$DISPLAY_VERSION" > version.txt
      - name: Independently rebuild all four targets
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: ${{ steps.toolchain.outputs.image-version }}
          target: esp32
          command: >-
            ./scripts/ci-build-all.sh
            "${{ needs.build.outputs.display-version }}"
            "${{ github.sha }}"
      - name: Upload independent rebuild evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: firmware-independent-rebuild
          if-no-files-found: error
          retention-days: 7
          path: |
            _unsigned/
            dist/

  publish:
    needs: [build, independent-rebuild]
    if: >-
      github.ref == 'refs/heads/main'
      && github.event_name == 'push'
      && needs.build.outputs.firmware == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: firmware-signing
    permissions:
      contents: write
      pages: read
      actions: read
    steps:
      # Checkout only the exact main commit that produced the unsigned data artifact.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind publish job to current main
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: ./scripts/select-release-version.sh --require-current-main "$SOURCE_SHA"

      - name: Download unsigned build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: firmware-unsigned
          path: .

      - name: Download independent rebuild evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: firmware-independent-rebuild
          path: _ci-independent

      - name: Validate build provenance
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_VERSION: ${{ needs.build.outputs.display-version }}
        run: |
          set -euo pipefail
          meta=dist/build-metadata.txt
          test -f "$meta" && test ! -L "$meta"
          test "$(sed -n '/^head_sha=/p' "$meta" | wc -l | tr -d ' ')" -eq 1
          test "$(sed -n '/^display_version=/p' "$meta" | wc -l | tr -d ' ')" -eq 1
          actual_sha="$(sed -n 's/^head_sha=//p' "$meta")"
          actual_version="$(sed -n 's/^display_version=//p' "$meta")"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "provenance SHA mismatch: expected=$EXPECTED_SHA actual=$actual_sha" >&2
            exit 1
          fi
          if [ "$actual_version" != "$EXPECTED_VERSION" ]; then
            echo "provenance version mismatch: expected=$EXPECTED_VERSION actual=$actual_version" >&2
            exit 1
          fi
          if find _unsigned -type l -print -quit | grep -q .; then
            echo "refusing symlinks in unsigned artifact" >&2
            exit 1
          fi
          # The downloaded producer manifest is only a claim. Recompute the source-tree
          # fingerprint from this exact protected checkout and rehash the full allowlisted tree.
          python3 scripts/check-build-artifact-inventory.py \
            --verify --artifact-root . --compare-to _ci-independent --source-root . \
            --expected-source-sha "$EXPECTED_SHA" --version "$EXPECTED_VERSION"

      - name: Revalidate current Release candidate before signing
        env:
          DISPLAY_VERSION: ${{ needs.build.outputs.display-version }}
          SOURCE_SHA: ${{ github.sha }}
        run: ./scripts/select-release-version.sh --require-release-candidate "$SOURCE_SHA" "$DISPLAY_VERSION"

      # The root installer and durable PR/<N>/ previews require one branch-backed site. Refuse the
      # signing boundary if the repository was switched to Actions Pages or another branch/path.
      - name: Validate branch-backed Pages authority before signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pages_json="$(mktemp)"
          trap 'rm -f "$pages_json"' EXIT
          gh api "repos/$GITHUB_REPOSITORY/pages" > "$pages_json"
          python3 scripts/check-pages-source.py "$pages_json"

      # A same-SHA retry may find the exact Release already published and immutable while Pages is
      # stale. That state must reuse all published bytes without exposing the key or attempting an
      # impossible immutable-Release mutation. Only an exact HTTP 404 selects first publication.
      - name: Classify first publication or immutable reuse
        id: release-mode
        env:
          GH_TOKEN: ${{ github.token }}
          DISPLAY_VERSION: ${{ needs.build.outputs.display-version }}
          RELEASE_VERSION: ${{ needs.build.outputs.release-version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          release_json="$(mktemp)"
          api_error="$(mktemp)"
          trap 'rm -f "$release_json" "$api_error"' EXIT
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$RELEASE_VERSION" \
              > "$release_json" 2> "$api_error"; then
            python3 scripts/check-release-assets.py "$release_json" \
              --metadata-only --version "$DISPLAY_VERSION" --source-sha "$SOURCE_SHA" \
              --expect-state published-immutable
            mode=reuse
          elif grep -Eq '\(HTTP 404\)' "$api_error"; then
            mode=create
          else
            echo "cannot classify GitHub Release state" >&2
            sed -n '1,5p' "$api_error" >&2
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Release publication mode: $mode"

      - name: Reuse and stage exact immutable Release bytes
        if: steps.release-mode.outputs.mode == 'reuse'
        env:
          GH_TOKEN: ${{ github.token }}
          DISPLAY_VERSION: ${{ needs.build.outputs.display-version }}
          RELEASE_VERSION: ${{ needs.build.outputs.release-version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ./scripts/select-release-version.sh --require-release-candidate "$SOURCE_SHA" "$DISPLAY_VERSION"
          test ! -e _release-reuse-download
          test ! -e _reuse-release.json
          mkdir _release-reuse-download
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$RELEASE_VERSION" > _reuse-release.json
          gh release download "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
            --dir _release-reuse-download
          python3 scripts/prepare-reused-release.py \
            _reuse-release.json _release-reuse-download . ./_fw \
            --version "$DISPLAY_VERSION" --source-sha "$SOURCE_SHA"

      - name: Revalidate absent Release candidate immediately before key provisioning
        if: steps.release-mode.outputs.mode == 'create'
        env:
          GH_TOKEN: ${{ github.token }}
          DISPLAY_VERSION: ${{ needs.build.outputs.display-version }}
          RELEASE_VERSION: ${{ needs.build.outputs.release-version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ./scripts/select-release-version.sh --require-release-candidate "$SOURCE_SHA" "$DISPLAY_VERSION"
          api_error="$(mktemp)"
          trap 'rm -f "$api_error"' EXIT
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$RELEASE_VERSION" \
              > /dev/null 2> "$api_error"; then
            echo "Release appeared after create-mode classification; refusing key provisioning" >&2
            exit 1
          fi
          grep -Eq '\(HTTP 404\)' "$api_error" || {
            echo "cannot prove Release candidate is absent" >&2
            sed -n '1,5p' "$api_error" >&2
            exit 1
          }

      - name: Provision OTA signing key
        if: steps.release-mode.outputs.mode == 'create'
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          if [ -z "$OTA_SIGNING_KEY" ]; then
            echo "OTA_SIGNING_KEY is required in the firmware-signing environment" >&2
            exit 1
          fi
          printf '%s\n' "$OTA_SIGNING_KEY" > ota_signing_key.pem
          chmod 600 ota_signing_key.pem

      # Only trusted main scripts and the digest-pinned ESP-IDF image see the key. No PR source is
      # compiled or executed in this job; the input artifact is handled strictly as binary data.
      - name: Sign and stage release artifacts
        if: steps.release-mode.outputs.mode == 'create'
        env:
          DISPLAY_VERSION: ${{ needs.build.outputs.display-version }}
          SOURCE_SHA: ${{ github.sha }}
        run: >-
          ./scripts/idf-docker.sh ./scripts/ci-sign-artifacts.sh
          "$DISPLAY_VERSION" _unsigned "$SOURCE_SHA" . _ci-independent

      - name: Remove OTA signing key
        if: always() && steps.release-mode.outputs.mode == 'create'
        run: rm -f ota_signing_key.pem

      # Create mode must prove that the protected secret is still the production authority;
      # reuse mode must prove that an immutable Release was not signed by an attacker's key.
      # This is key-free RSA-PSS verification against the reviewed public-key digest pin.
      - name: Verify production signing authority for all staged apps
        env:
          DISPLAY_VERSION: ${{ needs.build.outputs.display-version }}
        run: |
          set -euo pipefail
          for row in 'esp32|' 'esp32s3|-s3' 'esp32c3|-c3' 'esp32c6|-c6'; do
            target="${row%%|*}"
            suffix="${row#*|}"
            python3 scripts/check-firmware-artifacts.py \
              --target "$target" --version "$DISPLAY_VERSION" --signed-app \
              --bootloader "_fw/$target/bootloader.bin" \
              --app "tesla-key-esp32$suffix.bin" \
              --expected-public-key-digest scripts/ota-signing-public-key.sha256
          done

      # Both create and immutable-reuse mode must prove the complete local installer layout before
      # any Actions artifact upload or GitHub Release mutation can make the candidate external.
      - name: Assemble local Pages candidate before any publication
        env:
          DISPLAY_VERSION: ${{ needs.build.outputs.display-version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          ./scripts/select-release-version.sh --require-release-candidate "$SOURCE_SHA" "$DISPLAY_VERSION"
          ./scripts/build-pages.sh ./_site "$DISPLAY_VERSION" "$SOURCE_SHA"

      - name: Bind all 16 local Pages parts before any publication
        env:
          DISPLAY_VERSION: ${{ needs.build.outputs.display-version }}
          RELEASE_MODE: ${{ steps.release-mode.outputs.mode }}
        run: |
          set -euo pipefail
          release_dir=.
          if [ "$RELEASE_MODE" = reuse ]; then
            release_dir=_release-reuse-download
          elif [ "$RELEASE_MODE" != create ]; then
            echo "invalid Release publication mode: $RELEASE_MODE" >&2
            exit 1
          fi
          python3 scripts/check-release-pages-bytes.py \
            ./_site "$release_dir" --version "$DISPLAY_VERSION"

      - name: Revalidate current Release candidate immediately before signed artifact upload
        env:
          DISPLAY_VERSION: ${{ needs.build.outputs.display-version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ./scripts/select-release-version.sh --require-release-candidate "$SOURCE_SHA" "$DISPLAY_VERSION"
          python3 scripts/check-signed-root-inventory.py . --version "$DISPLAY_VERSION"

      - name: Upload signed firmware artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tesla-key-esp32-${{ needs.build.outputs.display-version }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            tesla-key-esp32.bin
            tesla-key-esp32-s3.bin
            tesla-key-esp32-c3.bin
            tesla-key-esp32-c6.bin
            tesla-key-esp32-${{ needs.build.outputs.display-version }}.bin
            tesla-key-esp32-s3-${{ needs.build.outputs.display-version }}.bin
            tesla-key-esp32-c3-${{ needs.build.outputs.display-version }}.bin
            tesla-key-esp32-c6-${{ needs.build.outputs.display-version }}.bin
            tesla-key-esp32-${{ needs.build.outputs.display-version }}-merged.bin
            tesla-key-esp32-s3-${{ needs.build.outputs.display-version }}-merged.bin
            tesla-key-esp32-c3-${{ needs.build.outputs.display-version }}-merged.bin
            tesla-key-esp32-c6-${{ needs.build.outputs.display-version }}-merged.bin
            _fw/esp32/bootloader.bin
            _fw/esp32/partition-table.bin
            _fw/esp32/tesla-key-esp32.bin
            _fw/esp32/ota_data_initial.bin
            _fw/esp32s3/bootloader.bin
            _fw/esp32s3/partition-table.bin
            _fw/esp32s3/tesla-key-esp32.bin
            _fw/esp32s3/ota_data_initial.bin
            _fw/esp32c3/bootloader.bin
            _fw/esp32c3/partition-table.bin
            _fw/esp32c3/tesla-key-esp32.bin
            _fw/esp32c3/ota_data_initial.bin
            _fw/esp32c6/bootloader.bin
            _fw/esp32c6/partition-table.bin
            _fw/esp32c6/tesla-key-esp32.bin
            _fw/esp32c6/ota_data_initial.bin
            dist/
            _site/

      - name: Revalidate current Release candidate immediately before Release mutation
        if: steps.release-mode.outputs.mode == 'create'
        env:
          GH_TOKEN: ${{ github.token }}
          DISPLAY_VERSION: ${{ needs.build.outputs.display-version }}
          RELEASE_VERSION: ${{ needs.build.outputs.release-version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ./scripts/select-release-version.sh --require-release-candidate "$SOURCE_SHA" "$DISPLAY_VERSION"
          api_error="$(mktemp)"
          trap 'rm -f "$api_error"' EXIT
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$RELEASE_VERSION" \
              > /dev/null 2> "$api_error"; then
            echo "Release appeared before draft creation; refusing Release mutation" >&2
            exit 1
          fi
          grep -Eq '\(HTTP 404\)' "$api_error" || {
            echo "cannot prove Release candidate is absent before draft creation" >&2
            sed -n '1,5p' "$api_error" >&2
            exit 1
          }
          python3 scripts/check-signed-root-inventory.py . --version "$DISPLAY_VERSION"

      # Upload into a mutable draft first. No draft becomes OTA/Pages authority until every one of
      # its exact 40 Release assets is rebound to the local bytes below.
      - name: Create draft release
        id: create-release
        if: steps.release-mode.outputs.mode == 'create'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ needs.build.outputs.release-version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.build.outputs.release-version }}
          generate_release_notes: true
          draft: true
          prerelease: false
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            tesla-key-esp32.bin
            tesla-key-esp32-s3.bin
            tesla-key-esp32-c3.bin
            tesla-key-esp32-c6.bin
            tesla-key-esp32-${{ needs.build.outputs.display-version }}.bin
            tesla-key-esp32-s3-${{ needs.build.outputs.display-version }}.bin
            tesla-key-esp32-c3-${{ needs.build.outputs.display-version }}.bin
            tesla-key-esp32-c6-${{ needs.build.outputs.display-version }}.bin
            tesla-key-esp32-${{ needs.build.outputs.display-version }}-merged.bin
            tesla-key-esp32-s3-${{ needs.build.outputs.display-version }}-merged.bin
            tesla-key-esp32-c3-${{ needs.build.outputs.display-version }}-merged.bin
            tesla-key-esp32-c6-${{ needs.build.outputs.display-version }}-merged.bin
            dist/*/*.elf
            dist/*/*.elf.sha256
            dist/*/*.map
            dist/*/sdkconfig.*
            dist/*/dependencies.lock.*
            dist/*/size-*.json
            dist/*/size-*.md

      - name: Bind complete draft Release and publish exact candidate
        if: steps.release-mode.outputs.mode == 'create'
        env:
          GH_TOKEN: ${{ github.token }}
          DISPLAY_VERSION: ${{ needs.build.outputs.display-version }}
          RELEASE_VERSION: ${{ needs.build.outputs.release-version }}
          SOURCE_SHA: ${{ github.sha }}
          DRAFT_RELEASE_ID: ${{ steps.create-release.outputs.id }}
        run: |
          set -euo pipefail
          draft_json="$(mktemp)"
          publish_json="$(mktemp)"
          trap 'rm -f "$draft_json" "$publish_json"' EXIT
          [[ "$DRAFT_RELEASE_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "draft action returned an invalid Release ID" >&2
            exit 1
          }
          gh api "repos/$GITHUB_REPOSITORY/releases/$DRAFT_RELEASE_ID" > "$draft_json"
          python3 scripts/check-release-assets.py "$draft_json" . \
            --version "$DISPLAY_VERSION" --source-sha "$SOURCE_SHA" \
            --expect-state draft \
            --expected-public-key-digest scripts/ota-signing-public-key.sha256
          release_id="$(jq -er '.id | select(type == "number" and . > 0)' "$draft_json")"
          [[ "$release_id" == "$DRAFT_RELEASE_ID" ]] || {
            echo "draft API response does not match the action Release ID" >&2
            exit 1
          }
          # Publication is the first point at which the Release can become channel authority. The
          # validator checked all 40 byte sets; refresh main/tag authority in the final command
          # immediately before PATCH so an advancing main can never publish a stale draft.
          ./scripts/select-release-version.sh --require-release-candidate "$SOURCE_SHA" "$DISPLAY_VERSION"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false -f make_latest=true > "$publish_json"

      - name: Refetch and accept immutable published Release
        if: steps.release-mode.outputs.mode == 'create'
        env:
          GH_TOKEN: ${{ github.token }}
          DISPLAY_VERSION: ${{ needs.build.outputs.display-version }}
          RELEASE_VERSION: ${{ needs.build.outputs.release-version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          release_json="$(mktemp)"
          trap 'rm -f "$release_json"' EXIT
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$RELEASE_VERSION" > "$release_json"
          python3 scripts/check-release-assets.py "$release_json" . \
            --version "$DISPLAY_VERSION" --source-sha "$SOURCE_SHA" \
            --expect-state published-immutable \
            --expected-public-key-digest scripts/ota-signing-public-key.sha256

  deploy:
    needs: [build, publish]
    if: >-
      github.ref == 'refs/heads/main'
      && github.event_name == 'push'
      && needs.build.outputs.firmware == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download exact signed Release and Pages candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tesla-key-esp32-${{ needs.build.outputs.display-version }}-${{ github.sha }}
          path: _deploy-input

      - name: Validate downloaded signed root and local Pages bytes
        env:
          DISPLAY_VERSION: ${{ needs.build.outputs.display-version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/check-signed-root-inventory.py ./_deploy-input \
            --version "$DISPLAY_VERSION"
          python3 scripts/check-pages-manifest.py ./_deploy-input/_site \
            --source-sha "$SOURCE_SHA" --version "$DISPLAY_VERSION"
          python3 scripts/check-release-pages-bytes.py \
            ./_deploy-input/_site ./_deploy-input --version "$DISPLAY_VERSION"

      - name: Revalidate branch-backed Pages authority immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          DISPLAY_VERSION: ${{ needs.build.outputs.display-version }}
          RELEASE_VERSION: ${{ needs.build.outputs.release-version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          pages_json="$(mktemp)"
          release_json="$(mktemp)"
          trap 'rm -f "$pages_json" "$release_json"' EXIT
          gh api "repos/$GITHUB_REPOSITORY/pages" > "$pages_json"
          python3 scripts/check-pages-source.py "$pages_json"
          ./scripts/select-release-version.sh --require-published-release "$SOURCE_SHA" "$DISPLAY_VERSION"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$RELEASE_VERSION" > "$release_json"
          python3 scripts/check-release-assets.py "$release_json" ./_deploy-input \
            --version "$DISPLAY_VERSION" --source-sha "$SOURCE_SHA" \
            --expect-state published-immutable \
            --expected-public-key-digest scripts/ota-signing-public-key.sha256

      - name: Deploy root site to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/publish-pages-branch.sh root ./_deploy-input/_site

      - name: Accept branch-served Pages against immutable Release bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPLAY_VERSION: ${{ needs.build.outputs.display-version }}
          RELEASE_VERSION: ${{ needs.build.outputs.release-version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          release_json="$(mktemp)"
          pages_json="$(mktemp)"
          trap 'rm -f "$release_json" "$pages_json"' EXIT
          gh api "repos/$GITHUB_REPOSITORY/pages" > "$pages_json"
          pages_base_url="$(python3 scripts/check-pages-source.py "$pages_json" --print-url)"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$RELEASE_VERSION" > "$release_json"
          python3 scripts/check-published-release.py \
            --pages-base-url "$pages_base_url" \
            --release-base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$RELEASE_VERSION" \
            --release-json "$release_json" \
            --version "$DISPLAY_VERSION" \
            --source-sha "$SOURCE_SHA" \
            --attempts 6 --interval 10 --timeout 15
