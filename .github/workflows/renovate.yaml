name: Renovate
on:
  schedule:
    - cron: '0 5 * * *'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  renovate:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_PLATFORM_COMMIT: true
          RENOVATE_GIT_AUTHOR: 'Oleg Burau <4757856+0Bu@users.noreply.github.com>'
          RENOVATE_EXTENDS: config:best-practices,helpers:pinGitHubActionDigests
          RENOVATE_AUTODISCOVER: true
          RENOVATE_AUTODISCOVER_FILTER: ${{ github.repository }}
          RENOVATE_CONFIG_MIGRATION: true
          # A maintainer runs the local pre-push verification before submitting its record.
          RENOVATE_AUTOMERGE: false
          RENOVATE_IGNORE_TESTS: false
          # 'auto' lets Renovate refresh/rebase its PR branches so they pick up
          # the latest target version and re-run required checks. 'never' froze
          # PRs (no version bump, no check re-run), which blocked automerge.
          RENOVATE_REBASE_WHEN: auto
          RENOVATE_SEMANTIC_COMMITS: disabled
#         LOG_LEVEL: debug
#         RENOVATE_DRY_RUN: full
