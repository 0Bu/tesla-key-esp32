dependencies:
  # ESP-IDF 6 carries Mbed TLS 4 / TF-PSA-Crypto. The pinned tesla-ble v5.2.0 still uses the legacy
  # Mbed TLS API, so patches/tesla-ble/0006-port-crypto-bindings-to-psa.patch ports its crypto
  # bindings to PSA; docs/adr/0002-idf6-mbedtls4-crypto-seam.md owns that migration.
  idf: ">=6.1,<7.0"

  # Espressif's own components come from their GitHub release sources, like tesla-ble below, so
  # every resolution is a reviewable Git commit pinned with its component hash in the per-target
  # lockfile. ESP-IDF 6 removed the built-in `json` and `mqtt` components (same headers and API:
  # cJSON.h, mqtt_client.h) and moved the SPI Ethernet drivers to esp-eth-drivers.
  espressif/mdns:
    git: "https://github.com/espressif/esp-protocols.git"
    path: "components/mdns"
    version: "mdns-v1.13.1"
  # idf-extra-components publishes cjson without Git tags; this commit is the 1.7.19~2 release.
  espressif/cjson:
    git: "https://github.com/espressif/idf-extra-components.git"
    path: "cjson"
    version: "0f5afa2f5be33f4f4979238041d5c38f3694ed13"
  espressif/mqtt:
    git: "https://github.com/espressif/esp-mqtt.git"
    version: "v1.1.0"
  # Tag w5500@v1.0.1. Only esp32s3 compiles the W5500 transport (CONFIG_TESLA_ETH_ENABLED, see
  # main/Kconfig.projbuild), so only its lockfile resolves the driver. 1.x keeps the flat
  # eth_w5500_config_t the firmware uses; 2.x nests it and adds a wiznet_common dependency.
  espressif/w5500:
    git: "https://github.com/espressif/esp-eth-drivers.git"
    path: "w5500"
    version: "1f19456ec90b60424583a4138c075a78e1ab2297"
    rules:
      - if: "target == esp32s3"

  # Pinned upstream yoziru/tesla-ble from git, for every target this project builds.
  # After the Component Manager materialises the source, root CMake applies the
  # ordered repository-owned patch series from patches/tesla-ble/ before compilation.
  #
  # The supported set is exactly the library's own `targets:` list — esp32 / esp32s3 /
  # esp32c3 / esp32c6 — and the Component Manager ENFORCES it at dependency resolution,
  # before compile. That is the property worth keeping: the chip list cannot silently
  # drift from what the crypto library declares it supports, and no local checkout of a
  # third-party dependency has to be maintained to widen it. (esp32c5 was carried that
  # way for a while and dropped — see docs/adr/0004-drop-esp32c5-target.md.)
  yoziru/tesla-ble:
    git: "https://github.com/yoziru/tesla-ble.git"
    version: "v5.2.0"
