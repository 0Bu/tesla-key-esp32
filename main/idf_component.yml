dependencies:
  idf: ">=5.0.1"
  espressif/mdns: "^1.2.0"

  # Pinned upstream yoziru/tesla-ble from git, for every target this project builds.
  # After the Component Manager materialises the source, root CMake applies the
  # repository-owned anti-replay patch from patches/tesla-ble/ before compilation.
  #
  # The supported set is exactly the library's own `targets:` list — esp32 / esp32s3 /
  # esp32c3 / esp32c6 — and the Component Manager ENFORCES it at dependency resolution,
  # before compile. That is the property worth keeping: the chip list cannot silently
  # drift from what the crypto library declares it supports, and no local checkout of a
  # third-party dependency has to be maintained to widen it. (esp32c5 was carried that
  # way for a while — see docs/adr/0001-esp32c5-target-upstreaming.md — and dropped.)
  yoziru/tesla-ble:
    git: "https://github.com/yoziru/tesla-ble.git"
    version: "v5.1.1"
