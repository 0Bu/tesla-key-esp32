<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e82127">
<title>tesla-key-esp32</title>
<style>
/*@@INLINE:style.css@@*/
</style>
</head>
<body>

<div class="wrap">

  <header class="top">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg></div>
    <div class="ttl">
      <h1>tesla-key-esp32</h1>
      <div class="sub"><span id="ipline"></span><button type="button" class="verlink" id="verLink" onclick="otaCheck()" title="Check for firmware updates" aria-label="Check for firmware updates" style="border:0;padding:0;background:transparent;font:inherit;color:inherit">&mdash;</button><span class="chan-wrap"><button type="button" class="chan-btn" id="chanBtn" onclick="toggleChanMenu(event)" onkeydown="handleChanBtnKey(event)" aria-label="Update channel" title="Update channel" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><div class="chan-menu hide" id="chanMenu" role="menu" aria-label="Update channel" onkeydown="handleChanKey(event)"><button type="button" class="chan-opt sel" id="optRelease" role="menuitemradio" aria-checked="true" aria-label="Release channel" onclick="setChannel('release')"><span class="chk">✓</span>Release</button><button type="button" class="chan-opt" id="optDev" role="menuitemradio" aria-checked="false" aria-label="Development channel" onclick="setChannel('dev')"><span class="chk"></span>Development</button></div></span><span class="otastat" id="otaStat" role="status" aria-live="polite" aria-atomic="true"></span></div>
    </div>
  </header>

  <!-- re-pair notice -->
  <div class="banner warn" id="reauthBanner">
    <div class="bi">!</div>
    <div class="bt"></div>
  </div>

  <!-- status grid -->
  <div class="grid">
    <button class="tile tap" onclick="editVin()">
      <svg class="tedit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      <div class="tlabel">Vehicle</div>
      <div class="tval mono" id="vehVal">&mdash;</div>
      <div class="tsub" id="vehSub"></div>
    </button>

    <button class="tile tap" onclick="genKey()">
      <svg class="tedit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      <div class="tlabel">Security key</div>
      <div class="tval mono" id="keyVal">&mdash;</div>
      <div class="tsub" id="keySub"></div>
    </button>

    <div class="tile wide">
      <div class="tlabel">Connections</div>
      <div class="conn">
        <div class="crow"><span class="ck" id="wifiLbl">Wi-Fi</span><span class="cv" id="wifiConn"><span class="ph">&mdash;</span></span></div>
        <div class="crow"><span class="ck">BLE</span><span class="cv" id="bleConn"><span class="ph">&mdash;</span></span></div>
        <button class="crow tap" onclick="editMqtt()" title="Tap to set the MQTT broker">
          <span class="ck">MQTT</span><span class="cv" id="mqttConn"><span class="ph">&mdash;</span></span>
          <svg class="cedit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        </button>
        <button class="crow tap" onclick="editSyslog()" title="Tap to set the Syslog server">
          <span class="ck">Syslog</span><span class="cv" id="syslogConn"><span class="ph">&mdash;</span></span>
          <svg class="cedit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- hero -->
  <!-- starts hidden: the first /status frame reveals it. Without this the empty skeleton
       flashes on the page for a beat on every reload before render() styles it. -->
  <div class="hero hide" id="hero">
    <div class="hicon" id="hicon"></div>
    <div class="hbody">
      <div class="hlabel" id="hlabel">&mdash;</div>
      <div class="hsub" id="hsub"></div>
      <div class="hstats" id="hstats"></div>
    </div>
  </div>

</div>

<div class="modal hide" id="otaModal" role="dialog" aria-modal="true" aria-labelledby="otaModalTitle" aria-describedby="otaHelp">
  <div class="modal-backdrop" id="otaBackdrop"></div>
  <div class="modal-card ota-modal-card">
    <div class="card-title" id="otaModalTitle">Firmware update</div>
    <div class="ota-offer">
      <div class="ota-version-line mono" id="otaVersionLine"></div>
      <span class="ota-channel" id="otaChannel"></span>
    </div>
    <div class="ota-changes-title">Changes in this update</div>
    <ul class="ota-changes" id="otaChanges"></ul>
    <p class="hint ota-no-changes" id="otaNoChanges" hidden>No changelog was supplied for this update.</p>
    <p class="hint ota-help" id="otaHelp">The device downloads the firmware and reboots when done.</p>
    <div class="modal-actions">
      <button class="btn secondary" type="button" id="otaCancel">Cancel</button>
      <button class="btn primary" type="button" id="otaInstall">Install update</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite" aria-atomic="true"></div>

<script>
//@@INLINE:app.js@@
</script>
</body>
</html>
