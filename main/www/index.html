<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e82127">
<title>tesla-key-esp32</title>
<style>
/*@@INLINE:style.css@@*/
</style>
</head>
<body>

<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <symbol id="ic-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></symbol>
    <symbol id="ic-pencil" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
    <symbol id="ic-car" viewBox="0 0 24 24"><path d="M19 17h2a1 1 0 0 0 1-1v-3a2 2 0 0 0-1.5-1.9L16 10l-2.2-2.3A2.5 2.5 0 0 0 12 7H5a1.6 1.6 0 0 0-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4a1 1 0 0 0 1 1h2"/><path d="M9 17h6"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></symbol>
    <symbol id="ic-key" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></symbol>
    <symbol id="ic-wifi" viewBox="0 0 24 24"><path d="M5 12.6a11 11 0 0 1 14 0"/><path d="M1.4 9a16 16 0 0 1 21.2 0"/><path d="M8.5 16.1a6 6 0 0 1 7 0"/><path d="M12 20h.01"/></symbol>
    <symbol id="ic-warn" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
    <symbol id="ic-bt" viewBox="0 0 24 24"><path d="m7 7 10 10-5 5V2l5 5L7 17"/></symbol>
    <symbol id="ic-chip" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/></symbol>
    <symbol id="ic-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></symbol>
    <symbol id="ic-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
  </defs>
</svg>

<div class="wrap" id="wrap" data-tab="car">

  <div class="col">
    <header class="top">
      <div class="brand">
        <span class="logo top-logo" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#ic-bolt"/></svg></span>
        <div class="ttl"><h1><span id="paneTitle">tesla-key-esp32</span><span class="wide-title">tesla-key-esp32</span></h1><span class="host mono" id="ipline"></span></div>
      </div>
      <span class="otastat" id="otaStat" aria-hidden="true"></span>
    </header>

    <main class="grid">
      <!-- re-pair / Safe Mode notice -->
      <div class="banner" id="reauthBanner">
        <span class="bi" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#ic-warn"/></svg></span>
        <span class="bt"></span>
        <button type="button" class="pill sm" id="bannerAct" onclick="bannerAction()">Open setup</button>
      </div>

      <!-- vehicle hero. Starts hidden: the first /status frame reveals it, so the empty
           skeleton never flashes on load. -->
      <section class="pane pane-car hero hide" id="hero" aria-label="Vehicle status">
        <div class="gauge" id="hicon"></div>
        <div class="htext">
          <h2 class="hlabel" id="hlabel">&mdash;</h2>
          <p class="hsub" id="hsub"></p>
        </div>
        <div class="hstats" id="hstats"></div>
      </section>

      <!-- settings card: all settings in one compact card, one row each -->
      <section class="pane pane-setup card rows" id="paneSettings" aria-label="Setup">
        <div class="row" id="rowVeh">
          <span class="ri"><svg viewBox="0 0 24 24"><use href="#ic-car"/></svg><span class="dot" id="vehDot"></span></span>
          <span class="rb"><span class="rl">Vehicle</span><span class="rv mono" id="vehVal">&mdash;</span><span class="rs" id="vehSub"></span></span>
          <button type="button" class="ib" id="vinBtn" onclick="editVin()" aria-label="Change VIN" title="Change VIN"><svg viewBox="0 0 24 24"><use href="#ic-pencil"/></svg></button>
        </div>
        <div class="row" id="rowKey">
          <span class="ri"><svg viewBox="0 0 24 24"><use href="#ic-key"/></svg><span class="dot" id="keyDot"></span></span>
          <span class="rb"><span class="rl">Security key</span><span class="rv mono" id="keyVal">&mdash;</span><span class="rs" id="keySub"></span></span>
          <button type="button" class="ib danger" id="keyBtn" onclick="genKey()" aria-label="Regenerate key" title="Regenerate key"><svg viewBox="0 0 24 24"><use href="#ic-refresh"/></svg></button>
        </div>
        <div class="row" id="rowWifi">
          <span class="ri"><svg id="wifiIcon" viewBox="0 0 24 24"><use href="#ic-wifi"/></svg><svg id="ethIcon" class="hide" viewBox="0 0 24 24"><path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/></svg><span class="dot" id="wifiDot"></span></span>
          <span class="rb"><span class="rl" id="wifiLbl">Wi-Fi</span><span class="rv" id="wifiVal">&mdash;</span><span class="rs" id="wifiSt"></span></span>
          <span class="rbar" id="wifiBars"></span>
        </div>
        <div class="row" id="rowBle">
          <span class="ri"><svg viewBox="0 0 24 24"><use href="#ic-bt"/></svg><span class="dot" id="bleDot"></span></span>
          <span class="rb" id="bleConn"><span class="rl">Bluetooth</span><span class="rv" id="bleVal">&mdash;</span><span class="rs" id="bleSt"></span></span>
          <span class="rbar" id="bleBars"></span>
        </div>
        <div class="row" id="rowMqtt">
          <span class="ri"><svg viewBox="0 0 24 24"><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2a6 6 0 0 1 0-8.5"/><path d="M16.2 7.8a6 6 0 0 1 0 8.5"/><path d="M19.1 4.9C23 8.8 23 15.1 19.1 19"/><circle cx="12" cy="12" r="2"/></svg><span class="dot" id="mqttDot"></span></span>
          <span class="rb"><span class="rl">MQTT</span><span class="rv mono" id="mqttVal">&mdash;</span><span class="rs" id="mqttSt"></span></span>
          <button type="button" class="ib" id="mqttBtn" onclick="editMqtt()" aria-label="Edit MQTT broker" title="Set the MQTT broker"><svg viewBox="0 0 24 24"><use href="#ic-pencil"/></svg></button>
        </div>
        <div class="row" id="rowSyslog">
          <span class="ri"><svg viewBox="0 0 24 24"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg><span class="dot" id="syslogDot"></span></span>
          <span class="rb"><span class="rl">Syslog</span><span class="rv mono" id="syslogVal">&mdash;</span><span class="rs" id="syslogSt"></span></span>
          <button type="button" class="ib" id="syslogBtn" onclick="editSyslog()" aria-label="Edit Syslog server" title="Set the Syslog server"><svg viewBox="0 0 24 24"><use href="#ic-pencil"/></svg></button>
        </div>
        <div class="row row-fw" id="rowFw">
          <span class="ri"><svg viewBox="0 0 24 24"><use href="#ic-chip"/></svg><span class="dot ok" id="fwDot"></span></span>
          <span class="rb">
            <span class="rl">Firmware</span>
            <button type="button" class="ver-btn" id="verLink" onclick="openChannelSelect()" aria-label="Change update channel" title="Change update channel">
              <span class="rv mono" id="fwVer">&mdash;</span>
              <span class="rs" id="fwSub">Release channel</span>
            </button>
          </span>
          <button type="button" class="ib" id="fwCheckBtn" onclick="openFwUpdate()" aria-label="Check for firmware updates" title="Check for firmware updates"><svg viewBox="0 0 24 24"><use href="#ic-download"/></svg></button>
          <div class="otabar hide" id="otaBar"><div class="otafill" id="otaFill"></div></div>
        </div>
      </section>
    </main>
  </div>
</div>

<!-- text-entry / confirmation sheet (replaces the native prompt()/confirm() dialogs) -->
<div class="modal hide" id="askModal" role="dialog" aria-modal="true" aria-labelledby="askTitle">
  <div class="modal-backdrop" id="askBackdrop"></div>
  <div class="sheet modal-card" tabindex="-1">
    <span class="warnic hide" id="askIcon" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#ic-warn"/></svg></span>
    <h2 class="sheet-title" id="askTitle"></h2>
    <p class="hide" id="askText"></p>
    <div class="field hide" id="askField">
      <div class="field-top"><label for="askInput" id="askLabel"></label><span class="field-hint" id="askHint"></span></div>
      <input id="askInput" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="askErr">
      <span class="field-err hide" id="askErr" role="alert"></span>
    </div>
    <div class="detail mono hide" id="askDetail"></div>
    <p class="note" id="askNote"></p>
    <div class="actions">
      <button type="button" class="btn secondary" id="askCancel">Cancel</button>
      <button type="button" class="btn primary" id="askOk">Save</button>
    </div>
  </div>
</div>

<div class="modal hide" id="chanModal" role="dialog" aria-modal="true" aria-labelledby="chanModalTitle">
  <div class="modal-backdrop" id="chanBackdrop"></div>
  <div class="sheet modal-card" tabindex="-1">
    <h2 class="sheet-title" id="chanModalTitle">Update channel</h2>
    <p class="note">Select the firmware update channel.</p>
    <div class="chan-options">
      <button type="button" class="chan-opt" id="chanOptRelease" onclick="selectChannel('release')">
        <div class="chan-opt-head">
          <span class="chan-opt-title">Release</span>
          <span class="chip-badge ok hide" id="chanBadgeRelease">Current</span>
        </div>
        <span class="chan-opt-desc">Official stable releases. Recommended for normal use.</span>
      </button>
      <button type="button" class="chan-opt" id="chanOptDev" onclick="selectChannel('dev')">
        <div class="chan-opt-head">
          <span class="chan-opt-title">Development</span>
          <span class="chip-badge warn hide" id="chanBadgeDev">Current</span>
        </div>
        <span class="chan-opt-desc">Bleeding edge builds with new features and testing changes.</span>
      </button>
    </div>
  </div>
</div>

<div class="modal hide" id="otaModal" role="dialog" aria-modal="true" aria-labelledby="otaModalTitle" aria-describedby="otaHelp">
  <div class="modal-backdrop" id="otaBackdrop"></div>
  <div class="sheet modal-card" tabindex="-1">
    <div class="ota-head"><h2 class="sheet-title" id="otaModalTitle">Firmware update</h2><span class="chip-badge" id="otaChannel"></span></div>
    <div class="ota-version mono" id="otaVersionLine"></div>
    <ul class="ota-changes" id="otaChanges"></ul>
    <p class="note" id="otaNoChanges" hidden>No changelog was supplied for this update.</p>
    <p class="note" id="otaHelp">The device downloads the firmware and reboots when done.</p>
    <div class="actions">
      <button type="button" class="btn secondary" id="otaCancel">Cancel</button>
      <button type="button" class="btn primary" id="otaInstall">Install update</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite" aria-atomic="true"></div>

<script>
//@@INLINE:app.js@@
</script>
</body>
</html>
