<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e82127">
<title>tesla-key-esp32</title>
<style>
/*@@INLINE:style.css@@*/
</style>
</head>
<body>

<div class="wrap" id="wrap" data-tab="car">

  <!-- section navigation: a bottom dock on phones, a left rail from 900 px (same buttons, CSS only) -->
  <nav class="dock" aria-label="Sections">
    <span class="logo rail-logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg></span>
    <button type="button" class="tab" id="tabCar" data-tab="car" onclick="setTab('car')" aria-current="page">
      <span class="ti"><svg viewBox="0 0 24 24"><path d="M19 17h2a1 1 0 0 0 1-1v-3a2 2 0 0 0-1.5-1.9L16 10l-2.2-2.3A2.5 2.5 0 0 0 12 7H5a1.6 1.6 0 0 0-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4a1 1 0 0 0 1 1h2"/><path d="M9 17h6"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg></span>Car
    </button>
    <button type="button" class="tab" id="tabSetup" data-tab="setup" onclick="setTab('setup')">
      <span class="ti"><svg viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg><span class="badge acc hide" id="badgeSetup"></span></span>Setup
    </button>
    <button type="button" class="tab" id="tabNet" data-tab="net" onclick="setTab('net')">
      <span class="ti"><svg viewBox="0 0 24 24"><path d="M5 12.6a11 11 0 0 1 14 0"/><path d="M1.4 9a16 16 0 0 1 21.2 0"/><path d="M8.5 16.1a6 6 0 0 1 7 0"/><path d="M12 20h.01"/></svg><span class="badge warn hide" id="badgeNet"></span></span>Network
    </button>
    <button type="button" class="tab" id="tabFw" data-tab="fw" onclick="setTab('fw')">
      <span class="ti"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/></svg><span class="badge info hide" id="badgeFw"></span></span>Firmware
    </button>
  </nav>

  <div class="col">
    <header class="top">
      <div class="brand">
        <span class="logo top-logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg></span>
        <div class="ttl"><h1><span id="paneTitle">tesla-key-esp32</span><span class="wide-title">tesla-key-esp32</span></h1><span class="host mono" id="ipline"></span></div>
      </div>
      <span class="otastat" id="otaStat" role="status" aria-live="polite" aria-atomic="true"></span>
    </header>

    <main class="grid">
      <!-- re-pair / Safe Mode notice -->
      <div class="banner" id="reauthBanner">
        <span class="bi" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></span>
        <span class="bt"></span>
        <button type="button" class="pill sm" id="bannerAct" onclick="bannerAction()">Open setup</button>
      </div>

      <!-- vehicle hero. Starts hidden: the first /status frame reveals it, so the empty
           skeleton never flashes on load. -->
      <section class="pane pane-car hero hide" id="hero" aria-label="Vehicle status">
        <div class="gauge" id="hicon"></div>
        <div class="htext">
          <h2 class="hlabel" id="hlabel">&mdash;</h2>
          <p class="hsub" id="hsub"></p>
        </div>
        <div class="hstats" id="hstats"></div>
        <button type="button" class="cta hide" id="heroAct" onclick="heroTap()"><span class="ci" id="heroActIc"></span><span id="heroActTx">Start charging</span></button>
      </section>

      <!-- setup: VIN + security key -->
      <section class="pane pane-setup stack" aria-label="Setup">
        <div class="card">
          <span class="lbl">Vehicle</span>
          <span class="val mono vin" id="vehVal">&mdash;</span>
          <span class="sub" id="vehSub"></span>
          <button type="button" class="pill soft" id="vinBtn" onclick="editVin()"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span id="vinBtnTx">Change VIN</span></button>
        </div>
        <div class="card">
          <span class="lbl">Security key</span>
          <span class="val mono" id="keyVal">&mdash;</span>
          <span class="sub strong" id="keySub"></span>
          <button type="button" class="pill danger" id="keyBtn" onclick="genKey()"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg><span id="keyBtnTx">Regenerate key</span></button>
        </div>
      </section>

      <!-- connections -->
      <section class="pane pane-net card rows" aria-label="Connections">
        <div class="row" id="rowWifi">
          <span class="ri"><svg id="wifiIcon" viewBox="0 0 24 24"><path d="M5 12.6a11 11 0 0 1 14 0"/><path d="M1.4 9a16 16 0 0 1 21.2 0"/><path d="M8.5 16.1a6 6 0 0 1 7 0"/><path d="M12 20h.01"/></svg><svg id="ethIcon" class="hide" viewBox="0 0 24 24"><path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/></svg><span class="dot" id="wifiDot"></span></span>
          <span class="rb"><span class="rl" id="wifiLbl">Wi-Fi</span><span class="rv" id="wifiVal">&mdash;</span><span class="rs" id="wifiSt"></span></span>
          <span class="rbar" id="wifiBars"></span>
        </div>
        <div class="row" id="rowBle">
          <span class="ri"><svg viewBox="0 0 24 24"><path d="m7 7 10 10-5 5V2l5 5L7 17"/></svg><span class="dot" id="bleDot"></span></span>
          <span class="rb" id="bleConn"><span class="rl">Bluetooth</span><span class="rv" id="bleVal">&mdash;</span><span class="rs" id="bleSt"></span></span>
          <span class="rbar" id="bleBars"></span>
        </div>
        <div class="row" id="rowMqtt">
          <span class="ri"><svg viewBox="0 0 24 24"><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2a6 6 0 0 1 0-8.5"/><path d="M16.2 7.8a6 6 0 0 1 0 8.5"/><path d="M19.1 4.9C23 8.8 23 15.1 19.1 19"/><circle cx="12" cy="12" r="2"/></svg><span class="dot" id="mqttDot"></span></span>
          <span class="rb"><span class="rl">MQTT</span><span class="rv mono" id="mqttVal">&mdash;</span><span class="rs" id="mqttSt"></span></span>
          <button type="button" class="ib" onclick="editMqtt()" aria-label="Edit MQTT broker" title="Set the MQTT broker"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
        </div>
        <div class="row" id="rowSyslog">
          <span class="ri"><svg viewBox="0 0 24 24"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg><span class="dot" id="syslogDot"></span></span>
          <span class="rb"><span class="rl">Syslog</span><span class="rv mono" id="syslogVal">&mdash;</span><span class="rs" id="syslogSt"></span></span>
          <button type="button" class="ib" onclick="editSyslog()" aria-label="Edit Syslog server" title="Set the Syslog server"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
        </div>
      </section>

      <!-- firmware -->
      <section class="pane pane-fw card stack fw" aria-label="Firmware">
        <div class="fwhead">
          <span class="logo big" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg></span>
          <div class="fwv"><span class="mono fwver" id="fwVer">&mdash;</span><span class="sub" id="fwSub"></span></div>
        </div>
        <div class="otabar hide" id="otaBar"><div class="otafill" id="otaFill"></div></div>
        <button type="button" class="pill soft wide-btn" id="verLink" onclick="otaCheck()" title="Check for firmware updates" aria-label="Check for firmware updates"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>Check for updates</button>
        <div class="chan">
          <span class="lbl">Update channel</span>
          <div class="seg" role="radiogroup" aria-label="Update channel" onkeydown="handleChanKey(event)">
            <button type="button" class="seg-opt sel" id="optRelease" role="radio" aria-checked="true" onclick="setChannel('release')">Release</button>
            <button type="button" class="seg-opt" id="optDev" role="radio" aria-checked="false" onclick="setChannel('dev')">Development</button>
          </div>
        </div>
        <div class="mono meta" id="fwHost"></div>
      </section>
    </main>
  </div>
</div>

<!-- text-entry / confirmation sheet (replaces the native prompt()/confirm() dialogs) -->
<div class="modal hide" id="askModal" role="dialog" aria-modal="true" aria-labelledby="askTitle">
  <div class="modal-backdrop" id="askBackdrop"></div>
  <div class="sheet">
    <span class="grab" aria-hidden="true"></span>
    <span class="warnic hide" id="askIcon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></span>
    <h2 class="sheet-title" id="askTitle"></h2>
    <p class="hide" id="askText"></p>
    <div class="field hide" id="askField">
      <div class="field-top"><label for="askInput" id="askLabel"></label><span class="field-hint" id="askHint"></span></div>
      <input id="askInput" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <div class="detail mono hide" id="askDetail"></div>
    <p class="note" id="askNote"></p>
    <div class="actions">
      <button type="button" class="btn secondary" id="askCancel">Cancel</button>
      <button type="button" class="btn primary" id="askOk">Save</button>
    </div>
  </div>
</div>

<div class="modal hide" id="otaModal" role="dialog" aria-modal="true" aria-labelledby="otaModalTitle" aria-describedby="otaHelp">
  <div class="modal-backdrop" id="otaBackdrop"></div>
  <div class="sheet">
    <span class="grab" aria-hidden="true"></span>
    <div class="ota-head"><h2 class="sheet-title" id="otaModalTitle">Firmware update</h2><span class="chip-badge" id="otaChannel"></span></div>
    <div class="ota-version mono" id="otaVersionLine"></div>
    <ul class="ota-changes" id="otaChanges"></ul>
    <p class="note" id="otaNoChanges" hidden>No changelog was supplied for this update.</p>
    <p class="note" id="otaHelp">The device downloads the firmware and reboots when done.</p>
    <div class="actions">
      <button type="button" class="btn secondary" id="otaCancel">Cancel</button>
      <button type="button" class="btn primary" id="otaInstall">Install update</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite" aria-atomic="true"></div>

<script>
//@@INLINE:app.js@@
</script>
</body>
</html>
