developer_instructions = """
Follow AGENTS.md as the canonical repository policy. Analysis, review, diagnosis, and triage are
read-only unless the user explicitly asks for implementation. An implementation request does not
authorize commit, push, pull-request creation, merge, release, flash, OTA, NVS operations, live
vehicle commands, or any action that could wake the vehicle. Ask for explicit user authorization
before any GitHub, hardware, or vehicle mutation. Treat NVS data, pairing keys, BLE sessions,
credentials, and OTA signing keys as secret material.
"""

[features]
multi_agent = true
hooks = true

[agents]
enabled = true
max_concurrent_threads_per_session = 3

[agents.agent_config_reviewer]
description = "Read-only audit of runner-neutral agent configuration, hooks, skills, and CI integration."
config_file = "agents/agent_config_reviewer.toml"

[agents.doc_drift_checker]
description = "Read-only Tesla firmware documentation and interface drift review."
config_file = "agents/doc_drift_checker.toml"

[agents.heap_safety_reviewer]
description = "Read-only review of contiguous-heap, exception, and reboot-loop risks."
config_file = "agents/heap_safety_reviewer.toml"

[agents.multi_target_build_reviewer]
description = "Read-only review of four-target build, signing, partition, and release contracts."
config_file = "agents/multi_target_build_reviewer.toml"

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@4.0.2"]
